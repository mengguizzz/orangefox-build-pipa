name: Build pipa OrangeFox

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      orangefox_branch:
        description: OrangeFox source branch. 14.1 has newer FBE userspace; 12.1 is the known fallback.
        required: true
        default: '14.1'
        type: choice
        options:
          - '14.1'
          - '12.1'

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free build space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force
          df -h

      - name: Check out this OrangeFox device tree
        uses: actions/checkout@v4

      - name: Expand build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 3072
          temp-reserve-mb: 1024

      - name: Set up OrangeFox build environment
        run: |
          # Keep this aligned with the upstream pipa builder.  OrangeFox's
          # current setup script owns the compatible Ubuntu 24 package list
          # and installs repo at /usr/local/bin/repo.
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts.git -b master orangefox-scripts
          sudo bash orangefox-scripts/setup/android_build_env.sh
          rm -rf orangefox-scripts

      - name: Sync OrangeFox source
        env:
          # workflow_dispatch provides this input, while a push does not.
          # Keep automated verification on the newer FBE-capable branch.
          FOX_BRANCH: ${{ inputs.orangefox_branch || '14.1' }}
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          test -x /usr/local/bin/repo
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git -b master sync
          ./sync/orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"

      - name: Install the patched pipa tree
        env:
          FOX_BRANCH: ${{ inputs.orangefox_branch || '14.1' }}
        run: |
          FOX_SOURCE="$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"
          test -f "$FOX_SOURCE/build/envsetup.sh"
          mkdir -p "$FOX_SOURCE/device/xiaomi/pipa"
          rsync -a --delete --exclude='.git' --exclude='OrangeFox' "$GITHUB_WORKSPACE/" "$FOX_SOURCE/device/xiaomi/pipa/"

      - name: Build OrangeFox boot image
        env:
          FOX_BRANCH: ${{ inputs.orangefox_branch || '14.1' }}
        run: |
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=pipa
          if [ "$FOX_BRANCH" = '14.1' ]; then
            lunch twrp_pipa-ap2a-eng
          else
            lunch twrp_pipa-eng
          fi
          mka adbd bootimage -j"$(nproc --all)"

      - name: Upload OrangeFox image and build logs
        uses: actions/upload-artifact@v4
        with:
          name: pipa-orangefox-${{ inputs.orangefox_branch || '14.1' }}
          path: |
            OrangeFox/fox_*/out/target/product/pipa/OrangeFox*.img
            OrangeFox/fox_*/out/target/product/pipa/OrangeFox*.zip
            OrangeFox/fox_*/out/target/product/pipa/boot.img
            OrangeFox/fox_*/out/target/product/pipa/recovery.log
          if-no-files-found: warn
