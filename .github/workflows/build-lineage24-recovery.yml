name: Build pipa Lineage 24 Recovery

on:
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free workspace
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force
          df -h

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize LineageOS 24 source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          repo init -u https://github.com/LineageOS/android.git -b lineage-24.0 --git-lfs --depth=1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j2

      - name: Add pipa Android 17 trees
        run: |
          cd "$GITHUB_WORKSPACE/android"
          rm -rf device/xiaomi/pipa device/xiaomi/sm8250-common vendor/xiaomi/pipa vendor/xiaomi/sm8250-common vendor/xiaomi/pipa-firmware device/xiaomi/pipa-kernel
          git clone --depth=1 -b 17 https://github.com/paranoid-pipa/device_xiaomi_pipa.git device/xiaomi/pipa
          git clone --depth=1 -b lineage-24.0 https://github.com/Tsaritsa-Prjkt/android_device_xiaomi_sm8250-common.git device/xiaomi/sm8250-common
          git clone --depth=1 -b 17 https://github.com/paranoid-pipa/vendor_xiaomi_pipa.git vendor/xiaomi/pipa
          git clone --depth=1 -b lineage-24.0 https://github.com/Tsaritsa-Prjkt/android_vendor_xiaomi_sm8250-common.git vendor/xiaomi/sm8250-common
          git clone --depth=1 https://github.com/paranoid-pipa/vendor_xiaomi_pipa-firmware.git vendor/xiaomi/pipa-firmware
          git clone --depth=1 -b 17 https://github.com/paranoid-pipa/kernel_xiaomi_pipa.git device/xiaomi/pipa-kernel

      - name: Build recovery-as-boot image
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_pipa-userdebug
          mka bootimage -j"$(nproc --all)"

      - name: Upload recovery boot image and logs
        uses: actions/upload-artifact@v4
        with:
          name: pipa-lineage24-recovery
          path: |
            android/out/target/product/pipa/boot.img
            android/out/target/product/pipa/recovery.img
            android/out/target/product/pipa/obj/PACKAGING/bootimage_intermediates/**
          if-no-files-found: warn

